<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel Vision</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf1f5;background:#091016;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#173249,#091016 45%);min-height:100vh}.shell{max-width:1450px;margin:auto;padding:28px 32px}.top,.toolbar,.cardhead,.cardfoot{display:flex;justify-content:space-between;align-items:center}.top{margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#20c5a6,#287cf0);font-size:20px}.brand b{font-size:19px}.brand small{display:block;color:#83929e;margin-top:3px}.state{display:flex;align-items:center;gap:8px;color:#91a1ad;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#667681}.dot.live{background:#24d49a;box-shadow:0 0 14px #24d49a}.toolbar{align-items:end;margin-bottom:16px}.toolbar h1{font-size:30px;margin:0 0 6px}.toolbar p{margin:0;color:#92a1ad}.upload{display:flex;gap:9px;align-items:center;background:#141e27;border:1px solid #2a3b47;border-radius:10px;padding:9px}.upload input{max-width:280px}.button,.control{border:0;border-radius:8px;padding:10px 15px;color:#fff;background:#287ff0;font-weight:700;cursor:pointer}.button:disabled{opacity:.5}.message{height:22px;color:#91a1ad;font-size:13px;margin-bottom:14px}.message.good{color:#6de0b3}.message.error{color:#ff9191}.cameras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#111b23dd;border:1px solid #2a3b47;border-radius:15px;overflow:hidden;box-shadow:0 18px 55px #0004}.cardhead{padding:15px 17px;border-bottom:1px solid #2a3b47}.cardhead strong{font-size:14px}.tag{font-size:11px;color:#8ed4ff;border:1px solid #34566c;border-radius:18px;padding:5px 9px}.screen{aspect-ratio:16/9;background:#020608;display:grid;place-items:center}.screen img{width:100%;height:100%;object-fit:contain}.empty{color:#72818c;font-size:13px}.actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #2a3b47}.control{background:#20313d;border:1px solid #3a4c58;padding:8px 13px}.control:hover{background:#2e4553}.counters{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:0 16px 13px}.counter{background:#17242d;border:1px solid #2a3b47;border-radius:8px;padding:8px}.counter small{display:block;color:#81919d;font-size:10px}.counter b{font-size:20px;color:#74ddb9}.cardfoot{padding:11px 16px;color:#82929f;font-size:12px;border-top:1px solid #2a3b47}@media(max-width:900px){.shell{padding:20px 14px}.toolbar{display:block}.upload{margin-top:16px}.cameras{grid-template-columns:1fr}}@media(max-width:500px){.counters{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">◉</div><div><b>Sentinel Vision</b><small>Multi-camera AI surveillance</small></div></div><div class="state"><i class="dot" id="dot"></i><span id="state">Ready</span></div></header><section class="toolbar"><div><h1>Camera monitoring</h1><p>Upload up to two videos, then start detection independently for each camera.</p></div><form class="upload" id="form"><input id="files" type="file" accept="video/*" multiple required><button class="button" id="upload">Upload cameras</button></form></section><div class="message" id="message">Select one or two video files to create camera feeds.</div><section class="cameras" id="cameras"></section></main><script>
const form=document.getElementById('form'),files=document.getElementById('files'),upload=document.getElementById('upload'),cameras=document.getElementById('cameras'),message=document.getElementById('message'),state=document.getElementById('state'),dot=document.getElementById('dot');let feeds=[];
const classes=['total','person','car','motorcycle','bus','truck'];
function card(feed,index){const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="cardhead"><strong>Camera ${index+1}</strong><span class="tag status">READY</span></div><div class="screen"><div class="empty">Click Start detection</div><img alt="Camera ${index+1} detection" style="display:none"></div><div class="actions"><button class="control start">Start detection</button><button class="control stop" disabled>Stop</button></div><div class="counters">${classes.map(c=>`<div class="counter"><small>${c}</small><b data-count="${c}">0</b></div>`).join('')}</div><div class="cardfoot"><span>${feed.filename}</span><span class="fps">Idle</span></div>`;const img=el.querySelector('img'),empty=el.querySelector('.empty'),tag=el.querySelector('.status'),start=el.querySelector('.start'),stop=el.querySelector('.stop');let timer;
async function refresh(){const r=await fetch('/api/counts/'+feed.session_id);if(!r.ok)return;const data=await r.json();classes.forEach(c=>el.querySelector(`[data-count="${c}"]`).textContent=data[c]||0)}
start.onclick=()=>{img.src=feed.stream_url;img.style.display='block';empty.style.display='none';start.disabled=true;stop.disabled=false;tag.textContent='LIVE';tag.style.color='#74ddb9';if(!feeds.some(x=>x.live)){state.textContent='Detection live';dot.className='dot live'}feed.live=true;timer=setInterval(refresh,500)};
stop.onclick=()=>{img.removeAttribute('src');img.style.display='none';empty.style.display='block';start.disabled=false;stop.disabled=true;tag.textContent='STOPPED';tag.style.color='#8ed4ff';clearInterval(timer);feed.live=false;if(!feeds.some(x=>x.live)){state.textContent='Ready';dot.className='dot'}};cameras.appendChild(el)}
form.onsubmit=async e=>{e.preventDefault();const remaining=2-feeds.length;const selected=[...files.files].slice(0,remaining);if(!selected.length){message.className='message error';message.textContent='The dashboard supports two cameras. Stop or refresh to upload different videos.';return}upload.disabled=true;message.className='message';message.textContent='Uploading cameras…';state.textContent='Uploading';try{for(const file of selected){const body=new FormData();body.append('file',file);const r=await fetch('/api/uploads',{method:'POST',body}),data=await r.json();if(!r.ok)throw Error(data.detail||'Upload failed');const feed={...data,filename:file.name,live:false};feeds.push(feed);card(feed,feeds.length-1)}message.className='message good';message.textContent=`${feeds.length} camera feed${feeds.length===1?'':'s'} ready. Start each camera when needed.`;state.textContent='Ready';files.value=''}catch(err){message.className='message error';message.textContent=err.message;state.textContent='Error'}finally{upload.disabled=false}};
</script></body></html>
