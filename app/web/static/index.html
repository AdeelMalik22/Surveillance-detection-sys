<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sentinel Vision</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#edf3f7;background:#090f14;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#163149,#090f14 46%)}.shell{max-width:1280px;margin:auto;padding:30px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#26c4a9,#277bef);font-size:20px}.brand b{font-size:19px}.brand small{display:block;color:#83929f;margin-top:3px}.status{display:flex;gap:8px;align-items:center;color:#94a5b1;font-size:13px}.dot{width:9px;height:9px;border-radius:99px;background:#64737d}.dot.live{background:#25d49a;box-shadow:0 0 14px #25d49a}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.heading h1{font-size:31px;margin:0 0 7px}.heading p{margin:0;color:#93a2ad}.upload{display:flex;gap:9px;align-items:center;padding:9px;border:1px solid #2b3b47;border-radius:11px;background:#141e27}.upload input{max-width:230px}.button{border:0;border-radius:8px;padding:11px 18px;background:#287ff0;color:white;font-weight:700;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.message{height:23px;margin:0 0 14px;color:#91a1ad;font-size:13px}.message.good{color:#6de0b3}.message.error{color:#ff9292}.viewer{background:#111b23;border:1px solid #2a3b47;border-radius:16px;overflow:hidden;box-shadow:0 18px 55px #0005}.viewer-head{display:flex;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #2a3b47;font-size:14px}.tag{color:#8ed3ff;border:1px solid #345468;border-radius:18px;padding:4px 9px;font-size:11px}.screen{background:#030608;aspect-ratio:16/9;display:grid;place-items:center}.screen img{display:none;width:100%;height:100%;object-fit:contain}.empty{color:#71818e;font-size:14px}.viewer-foot{display:flex;justify-content:space-between;padding:13px 18px;color:#82929f;font-size:12px}@media(max-width:800px){.shell{padding:20px 14px}.heading{display:block}.upload{margin-top:18px}.heading h1{font-size:26px}.upload input{max-width:170px}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div class="brand"><div class="logo">◉</div><div><b>Sentinel Vision</b><small>AI video surveillance workspace</small></div></div><div class="status"><i class="dot" id="dot"></i><span id="connection">Ready</span></div></header>
  <section class="heading"><div><h1>Live detection</h1><p>Upload a video to detect and track people and vehicles in one live view.</p></div><form class="upload" id="form"><input id="file" type="file" accept="video/*" required><button class="button" id="start">Analyze video</button></form></section>
  <div class="message" id="message">Choose a video file to begin.</div>
  <section class="viewer"><div class="viewer-head"><strong>Annotated camera feed</strong><span class="tag" id="tag">WAITING</span></div><div class="screen"><div class="empty" id="empty">Your annotated video will appear here</div><img id="stream" alt="Live annotated detection stream"></div><div class="viewer-foot"><span id="filename">No video loaded</span><span id="events">Events: 0</span></div></section>
</main><script>
const form=document.getElementById('form'),file=document.getElementById('file'),start=document.getElementById('start'),stream=document.getElementById('stream'),message=document.getElementById('message'),dot=document.getElementById('dot'),connection=document.getElementById('connection'),tag=document.getElementById('tag'),empty=document.getElementById('empty'),filename=document.getElementById('filename'),events=document.getElementById('events');let eventTimer;
form.onsubmit=async e=>{e.preventDefault();if(!file.files[0])return;start.disabled=true;message.className='message';message.textContent='Uploading video…';connection.textContent='Uploading';dot.className='dot';const body=new FormData();body.append('file',file.files[0]);try{const r=await fetch('/api/uploads',{method:'POST',body}),data=await r.json();if(!r.ok)throw Error(data.detail||'Upload failed');stream.src=data.stream_url;stream.style.display='block';empty.style.display='none';filename.textContent=file.files[0].name;tag.textContent='LIVE';connection.textContent='Detection live';dot.className='dot live';message.className='message good';message.textContent='Live detection is running. New person and vehicle tracks are recorded as events.';clearInterval(eventTimer);eventTimer=setInterval(async()=>{const response=await fetch('/api/events/'+data.session_id);if(response.ok){const result=await response.json();events.textContent='Events: '+result.count}},1000)}catch(err){message.className='message error';message.textContent=err.message;connection.textContent='Error';start.disabled=false}};
</script></body></html>
